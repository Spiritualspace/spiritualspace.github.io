<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री ललिता सहस्रनाम स्तोत्र | Spiritual Space</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #d4af37;
            --text-muted: #666666;
            --border-color: #eaeaea;
        }

        body {
            font-family: "Georgia", "Times New Roman", serif;
            margin: 0; padding: 0; line-height: 1.6; color: #333333; background-color: #ffffff;
        }

        header {
            text-align: center; padding: 30px 20px; border-bottom: 1px solid var(--border-color);
        }

        header a {
            color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500;
        }

        header a:hover { color: var(--primary-color); }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

        .page-header { text-align: center; margin-bottom: 30px; }

        .page-header h2 { font-size: 2rem; font-weight: normal; color: var(--primary-color); margin: 0 0 10px 0; }

        .divider { width: 60px; height: 1px; background-color: var(--accent-color); margin: 20px auto; }

        /* Unified Action Row Styling */
        .action-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
            background-color: #fffdf6;
            border: 1px solid #f1e5bc;
            padding: 25px;
            border-radius: 4px;
        }

        /* Reusable Elegant Button Class */
        .action-btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            font-family: sans-serif;
            min-width: 200px;
            text-align: center;
        }

        .action-btn:hover {
            background-color: var(--accent-color);
        }

        /* YouTube specific accent button coloring */
        .youtube-btn {
            background-color: #c4302b; /* Classic dark reddish hue for YouTube context */
        }

        .youtube-btn:hover {
            background-color: #e52d27;
        }

        .pdf-viewer-container {
            position: relative; width: 100%; height: 850px; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; background: #f5f5f5;
        }

        .pdf-viewer-container iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <header>
        <a href="sacred-chants.html">← Back to Sacred Chants</a>
    </header>

    <div class="container">
        <div class="page-header">
            <h2>श्री ललिता सहस्रनाम स्तोत्र</h2>
            <p>श्लोक एवं हिन्दी अर्थ सहित (संपूर्ण पुस्तक)</p>
            <div class="divider"></div>
        </div>

        <!-- RE-DESIGNED CLEAN ACTIONS SECTION WITH SIDE-BY-SIDE BUTTONS -->
        <div class="action-row">
            <!-- Native Download Link -->
            <a href="./lalita-sahasranama.pdf" download="lalita-sahasranama.pdf" class="action-btn">
                📥 Download Free PDF
            </a>

            <!-- Direct YouTube External Link (Bypasses regular iframe embedding security errors) -->
            <a href="https://www.youtube.com/watch?v=Hz0nnZB2QO8&t=763s" target="_blank" class="action-btn youtube-btn">
                ▶️ Play Audio on YouTube
            </a>
        </div>

        <!-- DIGITAL TABLE PDF VIEWER -->
        <h3 style="font-size: 1.3rem; font-weight: normal; color: var(--primary-color); margin-bottom: 15px;">
            📖 श्लोक एवं हिंदी अनुवाद (Text & Meaning)
        </h3>
        <div class="pdf-viewer-container">
            <iframe src="./lalita-sahasranama.pdf" type="application/pdf">
                <p>आपका डिवाइस डायरेक्ट पीडीएफ देखने का समर्थन नहीं करता है। कृपया ऊपर दिए गए बटन का उपयोग करके फ़ाइल डाउनलोड करें।</p>
            </iframe>
        </div>
    </div>

</body>
</html>
