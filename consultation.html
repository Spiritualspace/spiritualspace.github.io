<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhurat Services | Spiritual Space</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Core visual theme match */
        :root { --bg-color: #0b132b; --card-bg: #1c2541; --accent-gold: #d4af37; --text-light: #faf9f6; --text-muted: #a5a5a5; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-light); margin: 0; padding: 0; line-height: 1.6; }
        header { border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding: 20px 0; }
        .container { width: 85%; max-width: 650px; margin: 0 auto; }
        nav { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Lora', serif; font-size: 1.5rem; color: var(--accent-gold); text-decoration: none; }
        .nav-links a { color: var(--text-light); text-decoration: none; margin-left: 20px; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent-gold); }
        h1 { font-family: 'Lora', serif; color: var(--accent-gold); text-align: center; margin-top: 40px; }
        .form-desc { text-align: center; color: var(--text-muted); margin-bottom: 40px; }
        form { background-color: var(--card-bg); padding: 35px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--accent-gold); }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 4px; border: 1px solid rgba(212, 175, 55, 0.2); background-color: #0b132b; color: white; font-family: inherit; box-sizing: border-box; }
        .btn-submit { background-color: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold); padding: 12px 30px; border-radius: 4px; font-size: 1rem; cursor: pointer; transition: all 0.3s; width: 100%; }
        .btn-submit:hover { background-color: var(--accent-gold); color: var(--bg-color); }
        footer { text-align: center; padding: 40px 0; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid rgba(212, 175, 55, 0.1); margin-top: 60px; }
        footer a { color: var(--text-muted); text-decoration: none; }
    </style>
</head>
<body>
    <header>
        <div class="container" style="max-width: 1100px;">
            <nav>
                <a href="index.html" class="logo">Spiritual Space</a>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="wisdom.html">Philosophy</a>
                    <a href="consultation.html">Chart Analysis</a>
                    <a href="muhurat.html" class="active">Muhurat</a>
                    <a href="dakshina.html">Dakshina</a>
                </div>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1>Auspicious Muhurat Request</h1>
        <p class="form-desc">Calculate specific Panchang alignments for your new beginnings.</p>
        
        <form action="https://formspree.io" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="_replyto" required>
            </div>
            <div class="form-group">
                <label for="event_type">Nature of Event / Venture</label>
                <select id="event_type" name="event_type">
                    <option value="business">Business Launch / Shop Opening</option>
                    <option value="marriage">Sacred Marriage Ceremony</option>
                    <option value="griha_pravesh">Griha Pravesh (House Warming)</option>
                    <option value="other">Other Auspicious Milestone</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date_range">Preferred Date Window / Time Frame</label>
                <input type="text" id="date_range" name="date_range" required placeholder="e.g., Between Nov 1st and Nov 15th, 2026">
            </div>
            <div class="form-group">
                <label for="location">Location where event takes place (City, State)</label>
                <input type="text" id="location" name="location" required placeholder="Required for local sunrise/sunset calculations">
            </div>
            <button type="submit" class="btn-submit">Request Auspicious Calculation</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Spiritual Space. All Rights Reserved. | <a href="legal.html">Terms & Disclaimer</a></p>
    </footer>
</body>
</html>
